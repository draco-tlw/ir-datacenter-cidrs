name: BGP CIDR Extractor

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * *'
  
jobs:
  extract-ips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run CIDR Extractor Script
        run: python main.py

      - name: Upload CIDR List Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Optimized-CIDRs
          path: target_cidrs_optimized.txt
          retention-days: 7

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1

      - name: Create Rclone Config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf
          
      - name: Set current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload to Google Drive
        run: |
          rclone copyto target_cidrs_optimized.txt gdrive:ir-datacenter-cidrs/target_cidrs_${{ steps.date.outputs.date }}.txt
